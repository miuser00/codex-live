[package]
name = "codex-live-web-native"
version = "0.1.0"
edition = "2024"
description = "Single-file local browser viewer for Codex sessions"
license = "MIT"

[[bin]]
name = "CodexLiveWeb"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.45"
httparse = "1.10.1"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
